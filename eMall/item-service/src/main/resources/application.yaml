server:
  port: 8081


mall:
  swagger:
    title: "eMall item service API"
    package: com.ecomm.item.controller
  db:
    database: hm-item

spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090
      http-method-specify: true # for same endpoint but different method
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
